# Example configuration (placeholders only)
# Do NOT put real credentials here. Use environment variables in real deployments.

server.port=8097

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/email_assistant
spring.datasource.username=your_username
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=your_256_bit_jwt_secret_here
jwt.expiration=86400000

# Gemini / AI provider
gemini.api.key=your_gemini_api_key_here
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent

# Frontend
frontend.url=http://localhost:5173
